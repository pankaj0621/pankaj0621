<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p2-t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="p2-t">ANNRAKSHAK / CareSync: Food rescue and sustainable redistribution.</title>
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#090D12"/>
    </linearGradient>
    <radialGradient id="p2-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".7"/><stop offset="1" stop-color="#3B2F86" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p2-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#A78BFA" stroke-opacity=".07"/>
    </pattern>
    <filter id="p2-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p2-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p2-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/><stop offset=".45" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p2-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p2-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p2-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p2-in { animation: p2-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p2-d1 { animation-delay: .15s; } .p2-d2 { animation-delay: .4s; }
    .p2-chip { animation: p2-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p2-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p2-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p2-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p2-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p2-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p2-in, .p2-chip { animation: none; } .p2-draw { animation: none; stroke-dashoffset: 0; } }
    .p2-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p2-trace 7s linear infinite; }
    @keyframes p2-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p2-trace { display: none; } }
  </style>
  <g clip-path="url(#p2-clip)">
    <rect width="1200" height="370" fill="url(#p2-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p2-grid)"/>
    <rect width="1200" height="370" fill="url(#p2-glow)"/>
    <g class="p2-in p2-d1">
      <text class="p2-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#A78BFA">03 · WEB APPLICATION · FOOD RESCUE</text>
      <text class="p2-serif" x="54" y="126" font-size="46" font-weight="300" letter-spacing="-1.5" fill="#F8FAFC">ANNRAKSHAK / CareSync</text>
      <text class="p2-sans" x="56" y="166" font-size="17" fill="#9AA8B7">Food rescue and sustainable redistribution.</text>
      <text class="p2-mono" x="56" y="200" font-size="12.5" fill="#22D3EE"><tspan fill="#A78BFA">BUILT ›</tspan> connecting donors with people and organisations in need</text>
      <line class="p2-draw" x1="56" y1="226" x2="680" y2="226" stroke="#A78BFA" stroke-opacity=".3"/>
<g transform="translate(56 266)"><text class="p2-serif" font-size="26" font-weight="300" fill="#F8FAFC">Donations</text><text class="p2-sans" y="24" font-size="12.5" fill="#9AA8B7">management + claiming</text></g>
<g transform="translate(266 266)"><text class="p2-serif" font-size="26" font-weight="300" fill="#F8FAFC">Live updates</text><text class="p2-sans" y="24" font-size="12.5" fill="#9AA8B7">real-time</text></g>
<g transform="translate(476 266)"><text class="p2-serif" font-size="26" font-weight="300" fill="#F8FAFC">Discovery</text><text class="p2-sans" y="24" font-size="12.5" fill="#9AA8B7">location-based</text></g>
<g class="p2-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="58" height="26" rx="13" fill="#141923" stroke="#A78BFA" stroke-opacity=".35"/><text class="p2-mono" x="85" y="331" text-anchor="middle" font-size="11.5" fill="#22D3EE">React</text></g><g class="p2-chip" style="animation-delay:1.12s"><rect x="122" y="314" width="51" height="26" rx="13" fill="#141923" stroke="#A78BFA" stroke-opacity=".35"/><text class="p2-mono" x="148" y="331" text-anchor="middle" font-size="11.5" fill="#22D3EE">Vite</text></g><g class="p2-chip" style="animation-delay:1.24s"><rect x="181" y="314" width="110" height="26" rx="13" fill="#141923" stroke="#A78BFA" stroke-opacity=".35"/><text class="p2-mono" x="236" y="331" text-anchor="middle" font-size="11.5" fill="#22D3EE">Tailwind CSS</text></g><g class="p2-chip" style="animation-delay:1.36s"><rect x="299" y="314" width="88" height="26" rx="13" fill="#141923" stroke="#A78BFA" stroke-opacity=".35"/><text class="p2-mono" x="343" y="331" text-anchor="middle" font-size="11.5" fill="#22D3EE">Shadcn UI</text></g><g class="p2-chip" style="animation-delay:1.48s"><rect x="395" y="314" width="80" height="26" rx="13" fill="#141923" stroke="#A78BFA" stroke-opacity=".35"/><text class="p2-mono" x="435" y="331" text-anchor="middle" font-size="11.5" fill="#22D3EE">Supabase</text></g><g class="p2-chip" style="animation-delay:1.60s"><rect x="483" y="314" width="95" height="26" rx="13" fill="#141923" stroke="#A78BFA" stroke-opacity=".35"/><text class="p2-mono" x="530" y="331" text-anchor="middle" font-size="11.5" fill="#22D3EE">PostgreSQL</text></g><g class="p2-chip" style="animation-delay:1.72s"><rect x="586" y="314" width="117" height="26" rx="13" fill="#141923" stroke="#A78BFA" stroke-opacity=".35"/><text class="p2-mono" x="644" y="331" text-anchor="middle" font-size="11.5" fill="#22D3EE">React Leaflet</text></g>
    </g>
    <g class="p2-in p2-d2"><g transform="translate(0 35)">
      <g transform="translate(750 40)" class="p2-mono" font-size="13" text-anchor="middle">
        <text x="12" y="20" text-anchor="start" font-size="10.5" letter-spacing="2.4" fill="#9AA8B7">DONORS · PEOPLE · ORGANISATIONS</text>
        <path d="M12 120 H70" stroke="#A78BFA" stroke-opacity=".5"/>
        <path class="p2-draw" d="M186 120 C 221 120, 221 64, 256 64" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
        <path d="M186 120 C 221 120, 221 176, 256 176" fill="none" stroke="#A78BFA" stroke-opacity=".45" stroke-dasharray="4 6"/>
        <rect x="70" y="98" width="116" height="44" rx="22" fill="#141923" stroke="#A78BFA" stroke-opacity=".5"/>
        <text x="128.0" y="125" fill="#F8FAFC">donation</text>
        <rect x="256" y="42" width="116" height="44" rx="22" fill="#3B2F86" stroke="#22D3EE"/>
        <text x="314.0" y="69" fill="#F8FAFC">claimed</text>
        <rect x="256" y="154" width="116" height="44" rx="22" fill="#0D1117" stroke="#A78BFA" stroke-opacity=".4"/>
        <text x="314.0" y="181" fill="#9AA8B7">discovery</text>
        <circle r="4.5" fill="#F8FAFC" filter="url(#p2-glowf)"><animateMotion dur="3.6s" repeatCount="indefinite" path="M12 120 H186 C 221 120, 221 64, 256 64 H314.0" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .55 1"/></circle>
        <text x="12" y="236" text-anchor="start" font-size="10.5" letter-spacing="1.5" fill="#9AA8B7">Supabase · PostgreSQL · React Leaflet</text>
      </g>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#A78BFA" stroke-opacity=".2"/>
    <rect class="p2-trace" style="animation-delay:-1.7s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p2-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
