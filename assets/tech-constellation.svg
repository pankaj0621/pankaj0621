<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="tc-title tc-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="tc-title">Tech stack</title>
  <desc id="tc-desc">Languages: C, Java, Python, JavaScript, TypeScript, SQL. Frontend: HTML5, CSS3, React, Next.js, Tailwind CSS, Bootstrap, Shadcn UI. Backend and APIs: Node.js, Express.js, REST APIs, authentication, CRUD, API integration. Databases: MongoDB, MySQL, PostgreSQL, Supabase, Firebase. Creative UI: Figma, Three.js, GSAP, Framer Motion, Spline, CSS animation. Tools: Git, GitHub, VS Code, Postman, npm, Vite, Vercel, Netlify, Render. Foundations: data structures and algorithms, OOP, DBMS, operating systems, computer networks.</desc>
  <defs>
    <linearGradient id="tc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#090D12"/>
    </linearGradient>
    <radialGradient id="tc-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#3B2F86" stop-opacity=".9"/><stop offset="1" stop-color="#3B2F86" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tc-pulse">
      <stop offset="0" stop-color="#F8FAFC"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".6"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tc-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/><stop offset=".45" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .tc-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .tc-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tc-panel { animation: tc-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .tc-p1 { animation-delay: .05s; } .tc-p2 { animation-delay: .2s; } .tc-p3 { animation-delay: .35s; }
    .tc-p4 { animation-delay: .5s; } .tc-p5 { animation-delay: .65s; } .tc-p6 { animation-delay: .8s; }
    .tc-web { stroke-dasharray: 1800; stroke-dashoffset: 1800; animation: tc-draw 3s cubic-bezier(.65,0,.35,1) 1s forwards; }
    @keyframes tc-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes tc-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .tc-panel { animation: none; }
      .tc-web { animation: none; stroke-dashoffset: 0; }
    }
    .tc-trace { stroke-dasharray: 201 1120; stroke-dashoffset: 1321; animation: tc-trace 7s linear infinite; }
    @keyframes tc-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .tc-trace { display: none; } }
  </style>
  <rect width="1200" height="500" rx="20" fill="url(#tc-bg)"/>
  <rect width="1200" height="500" rx="20" fill="url(#tc-glow)"/>
  <rect x=".5" y=".5" width="1199" height="499" rx="19.5" fill="none" stroke="#A78BFA" stroke-opacity=".16"/>
  <path class="tc-web" d="M24 250 H1176 M406 24 V476 M794 24 V476" fill="none" stroke="#A78BFA" stroke-opacity=".22"/>
  <circle cx="0" cy="250" r="8" fill="url(#tc-pulse)" opacity="0">
    <animate attributeName="cx" values="24;1176" dur="9s" begin="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="9s" begin="3s" repeatCount="indefinite"/>
  </circle>
  <g fill="#090D12" stroke="#22D3EE">
    <rect x="400" y="244" width="12" height="12" transform="rotate(45 406 250)"/>
    <rect x="788" y="244" width="12" height="12" transform="rotate(45 794 250)"/>
  </g>
  <g class="tc-panel tc-p1"><g transform="translate(32 32)">
    <rect width="360" height="200" rx="14" fill="#0D1117" fill-opacity=".85" stroke="#A78BFA" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-0.00s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#A78BFA">01  LANGUAGES</text>
    <text class="tc-serif" x="24" y="92" font-size="40" font-weight="300" fill="#F8FAFC">JavaScript</text>
    <text class="tc-serif" x="24" y="138" font-size="26" font-weight="300" fill="#F8FAFC">TypeScript  ·  Python</text>
    <text class="tc-serif" x="24" y="176" font-size="22" font-weight="300" fill="#9AA8B7">Java  ·  C  ·  SQL</text>
    
  </g></g>
  <g class="tc-panel tc-p2"><g transform="translate(420 32)">
    <rect width="360" height="200" rx="14" fill="#0D1117" fill-opacity=".85" stroke="#A78BFA" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-1.15s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#A78BFA">02  FRONTEND</text>
    <text class="tc-serif" x="24" y="92" font-size="34" font-weight="300" fill="#F8FAFC">React  ·  Next.js</text>
    <text class="tc-serif" x="24" y="138" font-size="22" font-weight="300" fill="#F8FAFC">Tailwind CSS  ·  Shadcn UI</text>
    <text class="tc-serif" x="24" y="176" font-size="20" font-weight="300" fill="#9AA8B7">HTML5  ·  CSS3  ·  Bootstrap</text>
    
  </g></g>
  <g class="tc-panel tc-p3"><g transform="translate(808 32)">
    <rect width="360" height="200" rx="14" fill="#0D1117" fill-opacity=".85" stroke="#A78BFA" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-2.30s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#A78BFA">03  BACKEND &amp; APIS</text>
    <text class="tc-serif" x="24" y="92" font-size="32" font-weight="300" fill="#F8FAFC">Node.js  ·  Express</text>
    <text class="tc-serif" x="24" y="138" font-size="22" font-weight="300" fill="#F8FAFC">REST APIs  ·  Authentication</text>
    <text class="tc-serif" x="24" y="176" font-size="20" font-weight="300" fill="#9AA8B7">CRUD  ·  API integration</text>
    
  </g></g>
  <g class="tc-panel tc-p4"><g transform="translate(32 268)">
    <rect width="360" height="200" rx="14" fill="#0D1117" fill-opacity=".85" stroke="#A78BFA" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-3.45s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#A78BFA">04  DATABASES</text>
    <text class="tc-serif" x="24" y="92" font-size="26" font-weight="300" fill="#F8FAFC">MongoDB  ·  PostgreSQL</text>
    <text class="tc-serif" x="24" y="138" font-size="24" font-weight="300" fill="#F8FAFC">MySQL  ·  Supabase</text>
    <text class="tc-serif" x="24" y="176" font-size="22" font-weight="300" fill="#9AA8B7">Firebase</text>
    
  </g></g>
  <g class="tc-panel tc-p5"><g transform="translate(420 268)">
    <rect width="360" height="200" rx="14" fill="#0D1117" fill-opacity=".85" stroke="#A78BFA" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-4.60s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#A78BFA">05  CREATIVE UI</text>
    <text class="tc-serif" x="24" y="92" font-size="32" font-weight="300" fill="#F8FAFC">Three.js  ·  GSAP</text>
    <text class="tc-serif" x="24" y="138" font-size="22" font-weight="300" fill="#F8FAFC">Framer Motion  ·  Spline</text>
    <text class="tc-serif" x="24" y="176" font-size="20" font-weight="300" fill="#9AA8B7">Figma  ·  CSS animation</text>
    
  </g></g>
  <g class="tc-panel tc-p6"><g transform="translate(808 268)">
    <rect width="360" height="200" rx="14" fill="#0D1117" fill-opacity=".85" stroke="#A78BFA" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-5.75s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#A78BFA">06  TOOLS &amp; FUNDAMENTALS</text>
    <text class="tc-serif" x="24" y="92" font-size="28" font-weight="300" fill="#F8FAFC">Git  ·  GitHub  ·  Vite</text>
    <text class="tc-serif" x="24" y="138" font-size="20" font-weight="300" fill="#F8FAFC">Postman  ·  Vercel  ·  Render</text>
    <text class="tc-serif" x="24" y="176" font-size="18" font-weight="300" fill="#9AA8B7">DSA  ·  OOP  ·  DBMS  ·  OS  ·  CN</text>
    
  </g></g>
